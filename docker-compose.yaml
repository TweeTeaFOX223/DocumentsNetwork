services:
  client:
    container_name: client
    build:
      context: .
      dockerfile: ./settings/DockerfileClient
    volumes:
      - type: bind
        source: ./client
        target: /projects/client
      - client_node_modules:/projects/client/node_modules
    command: sh -c "npm install && npm start"
    ports:
      - 3000:3000
    tty: true
  mecab:
    container_name: mecab
    build:
      context: .
      dockerfile: ./settings/DockerfileMeCab
    volumes:
      - type: bind
        source: ./server-mecab
        target: /server-mecab
    ports:
      - 4000:4000
    tty: true
  cgi:
    container_name: cgi
    build:
      context: .
      dockerfile: ./settings/DockerfileCgi
    ports:
      - 80:80
    volumes:
      # リポジトリの0_dataに配置した検索対象のテキストを、
      # DockerのUbuntuの/usr/lib/cgi-bin/dataにマウント
      - ./0_data:/usr/lib/cgi-bin/data

volumes:
  client_node_modules:
