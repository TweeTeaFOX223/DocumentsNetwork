services:
  client:
    container_name: client
    build:
      context: .
      dockerfile: ./settings/DockerfileClient
    volumes:
      - type: bind
        source: ./client
        target: /projects/client
      - client_node_modules:/projects/client/node_modules
    command: sh -c "npm install && sh ./start.sh"
    ports:
      - 3000:3000
    tty: true
  mecab:
    container_name: mecab
    build:
      context: .
      dockerfile: ./settings/DockerfileMeCab
    volumes:
      - type: bind
        source: ./server-mecab
        target: /server-mecab
    ports:
      - 4000:4000
    tty: true
  cgi:
    container_name: cgi
    build:
      context: .
      dockerfile: ./settings/DockerfileCgi
    ports:
      - 80:80
    volumes:
      # ホスト側0_dataを一時参照用としてマウントし、
      # 起動時に必要ファイルのみ /usr/lib/cgi-bin/data へコピーする
      - ./0_data:/tmp/host-data:ro
    command: >-
      sh -c "
      cp /tmp/host-data/uid.txt /usr/lib/cgi-bin/data/uid.txt &&
      cp /tmp/host-data/doc.txt /usr/lib/cgi-bin/data/doc.txt &&
      cp /tmp/host-data/wakachi.txt /usr/lib/cgi-bin/data/wakachi.txt &&
      apachectl -D FOREGROUND
      "

volumes:
  client_node_modules:
